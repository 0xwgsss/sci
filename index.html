<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>presentation</title>

<!--
  ============================================================
  LOGO:
  Put your school logo image at:  logo/logo.png
  (create a folder named "logo" next to this index.html file,
   and drop your logo picture inside it named logo.png)
  If no file is found, a plain circle outline is shown instead.
  ============================================================
  TITLE / SCHOOL NAME:
  Edit the text inside #pageTitle and #schoolName below.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  :root{
    --bg:#000000;
    --ink:#f5f7fa;
    --dim:#8a93a3;
    --blue:#4f8dff;
    --blue-bright:#8ec3ff;
    --blue-deep:#1638a0;
    --card:#07090d;
    --card-line:rgba(79,141,255,0.35);
    --glow:rgba(79,141,255,0.45);
    --warn:#ffb020;
    --danger:#ff4b3e;
    --good:#38d68c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #bgCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; display:block; background:var(--bg);
  }

  .page{
    position:relative; z-index:1;
    max-width:980px; margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(16px,4vw,40px) 140px;
  }

  /* ---------- HERO / TITLE ---------- */
  .hero{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:clamp(18px,3.5vw,30px);
    margin-bottom:clamp(32px,6vw,56px);
  }

  .wave-title{
    margin:0; padding:0; line-height:1;
    display:flex; flex-wrap:wrap; justify-content:center;
    font-weight:700;
    font-size:clamp(2rem, 7vw, 4.4rem);
    letter-spacing:0.01em;
  }
  .wave-title span{
    display:inline-block;
    background:linear-gradient(180deg, var(--blue-bright), var(--blue) 55%, var(--blue-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px var(--glow));
    animation:waveLetter 2.6s ease-in-out infinite;
    animation-delay:calc(var(--i) * 0.07s);
    white-space:pre;
  }
  @keyframes waveLetter{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-0.16em); }
  }

  .brand-row{
    display:flex; align-items:center; gap:14px;
  }
  .logo-circle{
    width:clamp(46px,7vw,64px); height:clamp(46px,7vw,64px);
    border-radius:50%; overflow:hidden; flex-shrink:0;
    border:2px solid rgba(245,247,250,0.85);
    background:rgba(255,255,255,0.02);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-circle img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-circle.empty{ border:2px solid rgba(245,247,250,0.55); }
  .logo-circle.empty img{ display:none; }

  .school-name{
    margin:0; font-weight:500; color:var(--ink);
    font-size:clamp(0.85rem,2.2vw,1.15rem);
    letter-spacing:0.04em;
  }

  /* ---------- CONTROL PILLS ROW ---------- */
  .ctrl-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    margin-bottom:clamp(18px,3vw,26px);
  }
  .ctrl-btn{
    font-family:'Space Grotesk',sans-serif; font-weight:500;
    font-size:0.78rem; letter-spacing:0.02em;
    background:rgba(255,255,255,0.03); color:var(--ink);
    border:1px solid var(--card-line); border-radius:999px;
    padding:9px 18px; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .ctrl-btn:hover{ border-color:var(--blue); color:var(--blue-bright); box-shadow:0 0 16px -6px var(--glow); }
  .ctrl-btn:active{ transform:translateY(1px); }
  .ctrl-btn.active{ background:var(--blue); border-color:var(--blue); color:#04070d; box-shadow:0 0 20px -4px var(--glow); }

  /* ---------- SIM CARD ---------- */
  .sim-card{
    position:relative;
    border-radius:20px;
    background:radial-gradient(120% 140% at 50% 0%, rgba(79,141,255,0.10), rgba(0,0,0,0) 60%), var(--card);
    border:1px solid var(--card-line);
    box-shadow:0 0 0 1px rgba(79,141,255,0.06), 0 30px 60px -20px rgba(0,0,0,0.9), 0 0 40px -10px var(--glow);
    overflow:hidden;
    margin-bottom:clamp(18px,3vw,26px);
  }
  .sim-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    border-radius:20px;
    box-shadow:inset 0 0 60px rgba(79,141,255,0.05);
  }
  .sim-canvas-wrap{
    position:relative; width:100%;
    aspect-ratio:4/3;
  }
  @media (min-width:760px){
    .sim-canvas-wrap{ aspect-ratio:16/9; }
  }
  .sim-canvas-wrap canvas{
    position:absolute; inset:0; width:100%!important; height:100%!important;
    display:block; touch-action:none;
  }

  .hint-pill{
    position:absolute; top:12px; left:12px; z-index:2;
    font-size:0.68rem; letter-spacing:0.02em; color:var(--dim);
    background:rgba(6,8,12,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--card-line); border-radius:999px;
    padding:6px 12px; pointer-events:none;
  }

  .info-panel{
    position:absolute; left:14px; right:14px; bottom:14px; z-index:3;
    max-width:420px;
    background:rgba(4,6,10,0.92);
    border:1px solid var(--blue); border-radius:14px;
    padding:16px 18px;
    box-shadow:0 20px 50px -14px rgba(0,0,0,0.85), 0 0 30px -8px var(--glow);
    transform:translateY(140%); transition:transform .3s ease;
  }
  .info-panel.show{ transform:translateY(0); }
  .info-panel .label{ margin:0 0 4px; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--blue-bright); font-weight:700; }
  .info-panel h3{ margin:0; font-size:1rem; color:var(--ink); font-weight:700; text-align:center; }
  .info-panel p{ margin:0 0 10px; font-size:0.8rem; line-height:1.5; color:var(--dim); }
  .info-close{ position:absolute; top:10px; right:12px; cursor:pointer; color:var(--dim); font-size:0.9rem; }
  .info-close:hover{ color:var(--ink); }

  /* ---------- SIM LABELS (Simulator A / Simulator B headers) ---------- */
  .sim-label{
    text-align:center; margin:0 0 10px;
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--blue-bright); font-weight:700;
  }
  .sim-label span{ color:var(--dim); font-weight:500; letter-spacing:0.04em; text-transform:none; }

  .flow-caption{
    position:absolute; top:12px; right:12px; z-index:2;
    font-size:0.64rem; letter-spacing:0.01em; color:var(--dim);
    background:rgba(6,8,12,0.6); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--card-line); border-radius:999px;
    padding:6px 12px; pointer-events:none; max-width:62%; text-align:right;
  }
  .walk-stats{
    position:absolute; bottom:12px; left:12px; z-index:2;
    font-size:0.72rem; color:var(--blue-bright); font-weight:700;
    background:rgba(6,8,12,0.65); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid var(--card-line); border-radius:999px;
    padding:6px 12px;
  }

  /* ---------- STATUS PILL ---------- */
  .status-pill{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:0.78rem; color:var(--ink);
    background:var(--card); border:1px solid var(--card-line); border-radius:999px;
    padding:10px 18px; margin:0 auto clamp(18px,3vw,26px); width:fit-content; max-width:100%;
    text-align:center;
  }
  .status-dot{ width:9px; height:9px; border-radius:50%; background:var(--good); box-shadow:0 0 8px 2px var(--good); flex-shrink:0; transition:all .3s ease; }
  .status-dot.warn{ background:var(--warn); box-shadow:0 0 8px 2px var(--warn); }
  .status-dot.danger{ background:var(--danger); box-shadow:0 0 8px 2px var(--danger); }

  /* ---------- PRESSURE SLIDER (floating control bar) ---------- */
  .pressure-bar{
    position:fixed; left:50%; bottom:clamp(16px,4vw,28px);
    transform:translateX(-50%);
    z-index:5;
    width:min(560px, calc(100vw - 32px));
    padding:14px clamp(16px,4vw,24px);
    border-radius:999px;
    background:rgba(6,8,12,0.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-line);
    box-shadow:0 20px 50px -14px rgba(0,0,0,0.85), 0 0 30px -8px var(--glow);
    display:flex; align-items:center; gap:14px;
  }
  .pressure-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
    background:var(--blue);
    box-shadow:0 0 10px 3px var(--glow);
    transition:transform .15s ease;
  }
  .pressure-readout{
    flex-shrink:0; font-size:0.72rem; color:var(--blue-bright); font-weight:700;
    min-width:88px; text-align:right;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:4px; border-radius:4px; outline:none;
    background:linear-gradient(90deg, var(--blue) 0%, var(--blue) var(--fill,0%), rgba(255,255,255,0.14) var(--fill,0%), rgba(255,255,255,0.14) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eaf1ff, var(--blue) 60%, var(--blue-deep));
    box-shadow:0 0 0 5px rgba(79,141,255,0.18), 0 4px 12px rgba(0,0,0,0.6);
    cursor:pointer; border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; border:none;
    background:radial-gradient(circle at 35% 30%, #eaf1ff, var(--blue) 60%, var(--blue-deep));
    box-shadow:0 0 0 5px rgba(79,141,255,0.18), 0 4px 12px rgba(0,0,0,0.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{ height:4px; border-radius:4px; background:rgba(255,255,255,0.14); }

  @media (prefers-reduced-motion: reduce){
    .wave-title span{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="page">

  <header class="hero">
    <h1 class="wave-title" id="pageTitle">energy saving tile</h1>
    <div class="brand-row">
      <div class="logo-circle" id="logoCircle">
        <img id="schoolLogo" src="logo/logo.jpg" alt="">
      </div>
      <p class="school-name" id="schoolName">Philsaga High School Foundation INC.</p>
    </div>
  </header>

  <div class="ctrl-row">
    <button class="ctrl-btn" id="btnStep"> Step Now</button>
    <button class="ctrl-btn" id="btnNight"> Toggle Night</button>
    <button class="ctrl-btn" id="btnDemo">▷ Rush-Hour Demo</button>
    <button class="ctrl-btn" id="btnCharge"> Charge Battery</button>
    <button class="ctrl-btn" id="btnReset">↻ Reset</button>
  </div>

  <main>
    <p class="sim-label">Simulator A <span></span></p>
    <section class="sim-card" id="walkCard">
      <div class="sim-canvas-wrap" id="walkWrap">
        <canvas id="walkCanvas3d"></canvas>
        <div class="hint-pill">drag to orbit • tap a part to inspect</div>
        <div class="flow-caption">step → tile → generator → battery → bulb</div>
        <div class="walk-stats" id="walkStats">steps: 0 &nbsp;•&nbsp; stored: 0 J</div>
        <div class="info-panel" id="infoPanelA">
          <div class="info-close" id="infoCloseA">✕</div>
          <h3 id="infoNameA">—</h3>
        </div>
      </div>
    </section>

    <p class="sim-label">Simulator B <span></span></p>
    <section class="sim-card" id="simCard">
      <div class="sim-canvas-wrap">
        <canvas id="labCanvas3d"></canvas>
        <div class="hint-pill">drag to orbit • tap a part to inspect</div>
        <div class="info-panel" id="infoPanel">
          <div class="info-close" id="infoClose">✕</div>
          <h3 id="infoName">—</h3>
        </div>
      </div>
    </section>

    <div class="status-pill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">IDLE — waiting for footsteps</span>
    </div>
  </main>

</div>

<div class="pressure-bar">
  <div class="pressure-dot" id="pressureDot"></div>
  <input type="range" id="trafficSlider" min="0" max="40" value="10" step="1" aria-label="foot traffic rate">
  <span class="pressure-readout" id="trafficReadout">10/min</span>
</div>

<script>
/* =========================================================
   0. GLOBAL — reduced-motion, slider fill sync
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const slider = document.getElementById('trafficSlider');
const readout = document.getElementById('trafficReadout');
const dot = document.getElementById('pressureDot');
function syncSliderFill(){
  slider.style.setProperty('--fill', (slider.value/40*100) + '%');
}
syncSliderFill();

/* pulse the floating dot briefly on every real footstep */
let stepPulse = 0;
(function pulseTick(){
  stepPulse = Math.max(0, stepPulse - 0.03);
  dot.style.transform = `scale(${1 + stepPulse*0.7})`;
  requestAnimationFrame(pulseTick);
})();

/* logo fallback */
const logoImg = document.getElementById('schoolLogo');
const logoCircle = document.getElementById('logoCircle');
logoImg.addEventListener('error', () => logoCircle.classList.add('empty'));

/* title letters -> wavy spans */
(function waveText(){
  const el = document.getElementById('pageTitle');
  const text = el.textContent;
  el.textContent = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.setProperty('--i', i);
    el.appendChild(span);
  });
})();

/* =========================================================
   1. BACKGROUND: monochrome electric network + DNA helix
   ========================================================= */
(function bg(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  let nodes = [];
  let sparks = [];
  let helixPhase = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.max(38, Math.min(100, Math.floor((w*h)/16000)));
    nodes = Array.from({length:count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function drawHelix(dt){
    const rows = Math.max(1, Math.round(h/520));
    for(let r=0;r<rows;r++){
      const baseY = (h/rows)*(r+0.5);
      const amp = 46, freq = 0.012, gap = 34;
      ctx.lineWidth = 1;
      for(let x=0; x<w; x+=gap){
        const y1 = baseY + Math.sin(x*freq + helixPhase + r)*amp;
        const y2 = baseY + Math.sin(x*freq + helixPhase + r + Math.PI)*amp;
        const a = 0.12 + 0.06*Math.sin(x*0.02 + helixPhase*2);
        ctx.strokeStyle = `rgba(230,235,245,${Math.max(0,a*0.5)})`;
        ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
        ctx.fillStyle = `rgba(240,244,255,${Math.max(0,a)})`;
        ctx.beginPath(); ctx.arc(x,y1,1.6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x,y2,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    helixPhase += dt * 0.35;
  }

  function step(node){
    node.x += node.vx; node.y += node.vy;
    if(node.x < -20) node.x = w+20; if(node.x > w+20) node.x = -20;
    if(node.y < -20) node.y = h+20; if(node.y > h+20) node.y = -20;
  }

  function maybeSpark(){
    if(Math.random() < 0.012 && nodes.length > 2){
      const a = nodes[Math.floor(Math.random()*nodes.length)];
      const b = nodes[Math.floor(Math.random()*nodes.length)];
      sparks.push({a,b,t:0});
    }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);

    drawHelix(dt);

    const maxDist = Math.min(180, Math.max(110, w/9));
    for(let i=0;i<nodes.length;i++){
      step(nodes[i]);
      for(let j=i+1;j<nodes.length;j++){
        const dx = nodes[i].x-nodes[j].x, dy = nodes[i].y-nodes[j].y;
        const d = Math.hypot(dx,dy);
        if(d < maxDist){
          const a = (1 - d/maxDist) * 0.35;
          ctx.strokeStyle = `rgba(210,216,230,${a})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(235,238,245,0.55)';
      ctx.beginPath(); ctx.arc(nodes[i].x,nodes[i].y,1.7,0,Math.PI*2); ctx.fill();
    }

    maybeSpark();
    sparks.forEach(s => { s.t += dt * 0.9; });
    sparks = sparks.filter(s => s.t < 1);
    sparks.forEach(s => {
      const x = s.a.x + (s.b.x-s.a.x)*s.t;
      const y = s.a.y + (s.b.y-s.a.y)*s.t;
      const grad = ctx.createRadialGradient(x,y,0,x,y,10);
      grad.addColorStop(0,'rgba(150,190,255,0.95)');
      grad.addColorStop(1,'rgba(150,190,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(230,240,255,0.9)';
      ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* =========================================================
   2. SHARED THREE.JS HELPERS
   ========================================================= */
function makeRenderer(canvas){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = true;
  return renderer;
}
function fitRenderer(renderer, camera, wrap){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
/* shared click/tap-to-inspect wiring, used by both simulators */
function setupInspector(renderer, camera, scene, panelEl, nameEl, closeEl){
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const downPos = {x:0,y:0};
  closeEl.addEventListener('click', ()=>panelEl.classList.remove('show'));
  renderer.domElement.addEventListener('pointerdown', e=>{ downPos.x=e.clientX; downPos.y=e.clientY; });
  renderer.domElement.addEventListener('pointerup', e=>{
    const dx=e.clientX-downPos.x, dy=e.clientY-downPos.y;
    if(Math.sqrt(dx*dx+dy*dy)>6) return;
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(scene.children, true);
    for(const h of hits){
      let obj = h.object;
      while(obj && !obj.userData.name) obj = obj.parent;
      if(obj && obj.userData.name){
        nameEl.textContent = obj.userData.name;
        panelEl.classList.add('show');
        return;
      }
    }
  });
}

/* =========================================================
   3. WALK SIMULATOR (Simulator A) — a person walking across
   the tiled walkway. The tiles have see-through tops so the
   little generator underneath is visible spinning on every
   step, and a pulse of light travels down the wire into the
   battery + bulb — the whole "why it works" chain, at a
   glance, for the presentation.
   ========================================================= */
const walkWrap = document.getElementById('walkWrap');
const walkCanvas = document.getElementById('walkCanvas3d');
const walkRenderer = makeRenderer(walkCanvas);
const walkScene = new THREE.Scene();
walkScene.background = new THREE.Color(0x05070c);

const walkCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
walkCamera.position.set(0.5, 2.6, 9);

const walkControls = new THREE.OrbitControls(walkCamera, walkRenderer.domElement);
walkControls.target.set(0.5, 1.0, 0);
walkControls.enableDamping = true; walkControls.dampingFactor = 0.08;
walkControls.minDistance = 4; walkControls.maxDistance = 15;
walkControls.maxPolarAngle = Math.PI/2.1;

walkScene.add(new THREE.AmbientLight(0xdfe8ff, 0.55));
const walkSun = new THREE.DirectionalLight(0xeaf1ff, 0.9);
walkSun.position.set(4,7,4); walkSun.castShadow = true;
walkSun.shadow.mapSize.set(1024,1024);
walkScene.add(walkSun);
const walkRim = new THREE.PointLight(0x4f8dff, 1.0, 16);
walkRim.position.set(-4,3,-2);
walkScene.add(walkRim);

const walkFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(22,8),
  new THREE.MeshStandardMaterial({color:0x0a0d12, roughness:0.95, metalness:0.1})
);

function walkFirePulseChain(fromIndex){
  const segs = walkWireSegs.slice(fromIndex);

const WALK_HALF_RANGE = 6.2;
const WALK_SPEED = 1.35;
const WALK_LEG_SWING = 0.55;
const WALK_BATT_CAP = 600;
let walkDir = 1;
let walkPhase = 0;
let walkStepCount = 0;
let walkStoredJ = 0;

function walkTryTriggerTile(px){
  walkTiles.forEach(t=>{
    const d = Math.abs(px - t.position.x);
    if(d < 0.35 && t.userData.armed){
      t.userData.armed = false;
      t.userData.spin = 1.2;
      t.userData.squash = 1;
      walkFirePulseChain(walkTiles.indexOf(t));
      walkStepCount++;
      walkStoredJ = Math.min(WALK_BATT_CAP, walkStoredJ + 42);
      walkUpdateUI();
    } else if(d > 0.9){
      t.userData.armed = true;
    }
  });
}

function walkUpdateUI(){
  const pct = walkStoredJ/WALK_BATT_CAP;
  walkBattFill.scale.y = Math.max(0.03,pct)*24;
  walkBattFill.position.y = 0.02 + (Math.max(0.03,pct)*0.5)/2;
  walkBulbLight.intensity = 1.4*pct;
  walkLampGlassMat.emissiveIntensity = 0.15 + 0.85*pct;
  walkLampGlassMat.opacity = 0.4 + 0.4*pct;
  const statsEl = document.getElementById('walkStats');
  if(statsEl) statsEl.textContent = `steps: ${walkStepCount}  •  stored: ${Math.round(walkStoredJ)} J`;
}
walkUpdateUI();

function walkFit(){ fitRenderer(walkRenderer, walkCamera, walkWrap); }
window.addEventListener('resize', walkFit); walkFit();

let walkLast = performance.now();
function walkAnimate(now){
  requestAnimationFrame(walkAnimate);
  const dt = Math.min(0.05, (now-walkLast)/1000); walkLast = now;

  walkPerson.position.x += walkDir * WALK_SPEED * dt;
  if(walkPerson.position.x > WALK_HALF_RANGE){ walkDir = -1; walkPerson.rotation.y = Math.PI; }
  if(walkPerson.position.x < -WALK_HALF_RANGE){ walkDir = 1; walkPerson.rotation.y = 0; }

  walkPhase += dt * WALK_SPEED * 3.4;
  walkLegL.rotation.x =  Math.sin(walkPhase) * WALK_LEG_SWING;
  walkLegR.rotation.x = -Math.sin(walkPhase) * WALK_LEG_SWING;
  walkArmL.rotation.x = -Math.sin(walkPhase) * WALK_LEG_SWING * 0.8;
  walkArmR.rotation.x =  Math.sin(walkPhase) * WALK_LEG_SWING * 0.8;
  walkPerson.position.y = Math.abs(Math.sin(walkPhase)) * 0.03;

  walkTryTriggerTile(walkPerson.position.x);

  walkTiles.forEach(t=>{
    if(t.userData.spin>0.002){ t.userData.rotor.rotation.z += t.userData.spin; t.userData.spin *= 0.9; }
    if(t.userData.squash>0.002){
      t.userData.topMesh.position.y = 0.175 - t.userData.squash*0.03;
      t.userData.squash *= 0.85;
    } else {
      t.userData.topMesh.position.y = 0.175;
    }
  });

  walkStoredJ = Math.max(0, walkStoredJ - dt*0.4);
  walkUpdateUI();

  walkControls.update();
  walkRenderer.render(walkScene, walkCamera);
}
requestAnimationFrame(walkAnimate);

    const t = Math.min(1,(now-start)/dur);
    labPulseDot.position.copy(curve.getPointAt(t));
    if(t<1) requestAnimationFrame(step);
    else { labPulseDot.visible=false; if(onDone) onDone(); }
  }
  requestAnimationFrame(step);
}
function labFireChain(curves, dur, onEach, onDone){
  let i=0;
  function next(){
    if(i>=curves.length){ if(onDone) onDone(); return; }
    if(onEach) onEach(i);
    labFirePulse(curves[i], dur, ()=>{ i++; next(); });
  }
  next();
}

let labGenSpin = 0;
function labSpinGenerator(strength){ labGenSpin = 0.25 + strength*0.55; }

/* ---- raycaster click-to-inspect ---- */
setupInspector(labRenderer, labCamera, labScene, document.getElementById('infoPanel'), document.getElementById('infoName'), document.getElementById('infoClose'));

function resize(){ fitRenderer(labRenderer, labCamera, wrap); }
window.addEventListener('resize', resize); resize();

function labAnimate(){
  requestAnimationFrame(labAnimate);
  if(labGenSpin>0.002){
    labGenRotor.rotation.y += labGenSpin;
    labGenSpin *= 0.94;
  }
  {
    const isNight = labNightFlag;
    const targetAmbient = isNight ? LAB_AMBIENT_NIGHT : LAB_AMBIENT_DAY;
    const targetSun = isNight ? LAB_SUN_NIGHT : LAB_SUN_DAY;
    labAmbient.intensity += (targetAmbient - labAmbient.intensity) * 0.06;
    labSun.intensity += (targetSun - labSun.intensity) * 0.06;
    const targetBg = isNight ? labBgNightColor : labBgDayColor;
    labScene.background.lerp(targetBg, 0.06);
  }
  labControls.update();
  labRenderer.render(labScene, labCamera);
}
labAnimate();

labSetBattery(0); labSetBulb(0);

/* =========================================================
   4. PHYSICS + STATE — drives the 3D lab from the traffic slider
   ========================================================= */
const G = 9.81;
const TILE_COMPRESSION = 0.006;
const MECH_TO_AC_EFF = 0.30;
const RECTIFIER_EFF = 0.92;
const CHARGE_EFF = 0.90;
const DISCHARGE_EFF = 0.95;
const BATTERY_CAPACITY_J = 600;
const SELF_DISCHARGE_J_S = 0.015;
const BULB_WATT = 0.35;
const LOW_CUTOFF_PCT = 6;

const state = {
  rate:10, night:false, batteryJ:0, bulbPower:0,
  steps:0, mechEnergy:0, storedEnergy:0, accumulator:0, loadShedLogged:false
};

const $ = id => document.getElementById(id);

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function batteryPct(){ return state.batteryJ/BATTERY_CAPACITY_J*100; }
function addLog(text){
  const logEl = $('log');
  if(logEl) logEl.textContent = text;
}

const weightProfiles = [[22,'a child'],[70,'an adult'],[70,'an adult'],[95,'a heavy adult']];

function doStep(){
  state.steps++;
  stepPulse = Math.min(1, stepPulse + 0.6);
  const [w, who] = weightProfiles[Math.floor(Math.random()*weightProfiles.length)];
  const dynamicLoad = 1.2 + Math.random()*0.6;
  const irregularity = 0.9 + Math.random()*0.2;
  const force = w * G * dynamicLoad * irregularity;
  const mech = force * TILE_COMPRESSION;
  const ac = mech * MECH_TO_AC_EFF;
  const dc = ac * RECTIFIER_EFF;
  const stored = dc * CHARGE_EFF;

  state.mechEnergy += mech;
  state.storedEnergy += stored;
  state.batteryJ = clamp(state.batteryJ + stored, 0, BATTERY_CAPACITY_J);

  addLog(`Step by ${who} → ${mech.toFixed(1)}J mechanical → ${stored.toFixed(1)}J stored (chain eff. ${Math.round(stored/mech*100)}%)`);

  labSpinGenerator(clamp((w-22)/(150-22),0,1)+0.3);
}

function updateUI(){
  const pct = batteryPct(), pctR = Math.round(pct);

  labSetBattery(pctR);
  labSetBulb(state.bulbPower);

  $('btnNight').classList.toggle('active', state.night);


  const warn = pct<=LOW_CUTOFF_PCT && state.night;
  const dotEl = $('statusDot');
  dotEl.className = 'status-dot' + (warn?' danger':state.bulbPower>0?' warn':'');
  $('statusText').textContent = warn
    ? `CRITICAL — battery at ${pctR}%, load-shed to protect the cells`
    : state.night
      ? (state.bulbPower>0 ? `DISCHARGING — powering the bulb (battery ${pctR}%)` : `NIGHT — battery empty, bulb off`)
      : (state.rate>0 ? `CHARGING (battery ${pctR}%)` : `IDLE — waiting for footsteps (battery ${pctR}%)`);
}

function applyBulbLogic(){
  if(state.night && batteryPct()>LOW_CUTOFF_PCT){
    state.bulbPower = 100;
    state.loadShedLogged = false;
  } else if(state.night){
    state.bulbPower = 0;
    if(!state.loadShedLogged){ addLog('Battery hit its low-charge cutoff — controller load-shed the bulb.'); state.loadShedLogged = true; }
  } else {
    state.bulbPower = 0;
  }
}

setInterval(()=>{
  state.batteryJ = clamp(state.batteryJ - SELF_DISCHARGE_J_S, 0, BATTERY_CAPACITY_J);
  state.accumulator += state.rate/60;
  while(state.accumulator>=1){ doStep(); state.accumulator -= 1; }

  applyBulbLogic();
  if(state.bulbPower>0){
    state.batteryJ = clamp(state.batteryJ - BULB_WATT/DISCHARGE_EFF, 0, BATTERY_CAPACITY_J);
  }

  updateUI();
},1000);

/* ---- controls ---- */
function syncRate(val){
  state.rate = Number(val);
  readout.textContent = state.rate+'/min';
  syncSliderFill();
  updateUI();
}
slider.addEventListener('input', e=>syncRate(e.target.value));

$('btnStep').addEventListener('click', doStep);

$('btnCharge').addEventListener('click', ()=>{
  state.batteryJ = BATTERY_CAPACITY_J;
  addLog('Battery quick-charged to 100% for demo purposes.');
  applyBulbLogic();
  updateUI();
});

function toggleNight(){
  // Every click flips between NIGHT and DAY.
  state.night = !state.night;
  labNightFlag = state.night;

  // DAY mode always forces the bulb OFF.
  if(!state.night){
    state.bulbPower = 0;
  }

  state.loadShedLogged = false;

  // Keep the log optional so the toggle cannot break if no #log element exists.
  const logEl = $('log');
  if(logEl){
    logEl.textContent = state.night
      ? 'Switched to NIGHT MODE — controller now powers the bulb from the battery.'
      : 'Switched to DAY MODE — bulb off, battery just charges.';
  }

  applyBulbLogic();
  updateUI();
}

$('btnNight').addEventListener('click', toggleNight);

let demoTimer=null;
$('btnDemo').addEventListener('click', ()=>{
  clearInterval(demoTimer);
  addLog('Running rush-hour demo: traffic ramps up, peaks, then tapers off.');
  const seq = [4,10,18,26,34,40,34,26,18,10,4,0];
  let i=0;
  demoTimer = setInterval(()=>{
    slider.value = seq[i];
    syncRate(seq[i]);
    i++;
    if(i>=seq.length) clearInterval(demoTimer);
  },1400);
});

$('btnReset').addEventListener('click', ()=>{
  clearInterval(demoTimer);
  state.batteryJ=0; state.bulbPower=0; state.night=false; state.steps=0;
  state.mechEnergy=0; state.storedEnergy=0; state.accumulator=0; state.loadShedLogged=false;
  labNightFlag = false;
  slider.value=10; syncRate(10);
  addLog('System reset.');
  updateUI();
});

syncRate(slider.value);

if(typeof THREE === 'undefined'){
  console.error('Three.js did not load — check your internet connection, since the 3D scene is loaded from a CDN.');
}
</script>
