<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Piezoelectric Tile</title>

<!--
  ============================================================
  LOGO:
  Put your school logo image at:  logo/logo.png
  (create a folder named "logo" next to this index.html file,
   and drop your logo picture inside it named logo.png)
  If no file is found, a plain circle outline is shown instead.
  ============================================================
  TITLE / SCHOOL NAME:
  Edit the text inside #pageTitle and #schoolName below.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
  :root{
    --bg:#000000;
    --ink:#f5f7fa;
    --dim:#8a93a3;
    --blue:#4f8dff;
    --blue-bright:#8ec3ff;
    --blue-deep:#1638a0;
    --card:#07090d;
    --card-line:rgba(79,141,255,0.35);
    --glow:rgba(79,141,255,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  #bgCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; display:block; background:var(--bg);
  }

  .page{
    position:relative; z-index:1;
    max-width:1180px; margin:0 auto;
    padding:clamp(28px,6vw,64px) clamp(16px,4vw,40px) 140px;
  }

  /* ---------- HERO / TITLE ---------- */
  .hero{
    display:flex; flex-direction:column; align-items:center;
    text-align:center; gap:clamp(18px,3.5vw,30px);
    margin-bottom:clamp(40px,7vw,72px);
  }

  .wave-title{
    margin:0; padding:0; line-height:1;
    display:flex; flex-wrap:wrap; justify-content:center;
    font-weight:700;
    font-size:clamp(2rem, 7vw, 4.4rem);
    letter-spacing:0.01em;
  }
  .wave-title span{
    display:inline-block;
    background:linear-gradient(180deg, var(--blue-bright), var(--blue) 55%, var(--blue-deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px var(--glow));
    animation:waveLetter 2.6s ease-in-out infinite;
    animation-delay:calc(var(--i) * 0.07s);
    white-space:pre;
  }
  @keyframes waveLetter{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-0.16em); }
  }

  .brand-row{
    display:flex; align-items:center; gap:14px;
  }
  .logo-circle{
    width:clamp(46px,7vw,64px); height:clamp(46px,7vw,64px);
    border-radius:50%; overflow:hidden; flex-shrink:0;
    border:2px solid rgba(245,247,250,0.85);
    background:rgba(255,255,255,0.02);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-circle img{ width:100%; height:100%; object-fit:cover; display:block; }
  .logo-circle.empty{ border:2px solid rgba(245,247,250,0.55); }
  .logo-circle.empty img{ display:none; }

  .school-name{
    margin:0; font-weight:500; color:var(--ink);
    font-size:clamp(0.85rem,2.2vw,1.15rem);
    letter-spacing:0.04em;
  }

  /* ---------- SIM CARDS ---------- */
  .sims{
    display:grid; grid-template-columns:1fr; gap:clamp(20px,4vw,32px);
  }
  @media (min-width:980px){
    .sims{ grid-template-columns:1fr 1fr; }
  }

  .sim-card{
    position:relative;
    border-radius:20px;
    background:radial-gradient(120% 140% at 50% 0%, rgba(79,141,255,0.10), rgba(0,0,0,0) 60%), var(--card);
    border:1px solid var(--card-line);
    box-shadow:0 0 0 1px rgba(79,141,255,0.06), 0 30px 60px -20px rgba(0,0,0,0.9), 0 0 40px -10px var(--glow);
    overflow:hidden;
  }
  .sim-card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    border-radius:20px;
    box-shadow:inset 0 0 60px rgba(79,141,255,0.05);
  }
  .sim-canvas-wrap{
    position:relative; width:100%;
    aspect-ratio:4/3;
  }
  @media (min-width:980px){
    .sim-canvas-wrap{ aspect-ratio:1/1; }
  }
  .sim-canvas-wrap canvas{
    position:absolute; inset:0; width:100%!important; height:100%!important;
    display:block; touch-action:none;
  }

  /* ---------- PRESSURE SLIDER (floating control bar) ---------- */
  .pressure-bar{
    position:fixed; left:50%; bottom:clamp(16px,4vw,28px);
    transform:translateX(-50%);
    z-index:5;
    width:min(560px, calc(100vw - 32px));
    padding:14px clamp(16px,4vw,24px);
    border-radius:999px;
    background:rgba(6,8,12,0.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--card-line);
    box-shadow:0 20px 50px -14px rgba(0,0,0,0.85), 0 0 30px -8px var(--glow);
    display:flex; align-items:center; gap:14px;
  }
  .pressure-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
    background:var(--blue);
    box-shadow:0 0 10px 3px var(--glow);
    transition:transform .15s ease;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:4px; border-radius:4px; outline:none;
    background:linear-gradient(90deg, var(--blue) 0%, var(--blue) var(--fill,0%), rgba(255,255,255,0.14) var(--fill,0%), rgba(255,255,255,0.14) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eaf1ff, var(--blue) 60%, var(--blue-deep));
    box-shadow:0 0 0 5px rgba(79,141,255,0.18), 0 4px 12px rgba(0,0,0,0.6);
    cursor:pointer; border:none;
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; border:none;
    background:radial-gradient(circle at 35% 30%, #eaf1ff, var(--blue) 60%, var(--blue-deep));
    box-shadow:0 0 0 5px rgba(79,141,255,0.18), 0 4px 12px rgba(0,0,0,0.6);
    cursor:pointer;
  }
  input[type=range]::-moz-range-track{ height:4px; border-radius:4px; background:rgba(255,255,255,0.14); }

  @media (prefers-reduced-motion: reduce){
    .wave-title span{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="page">

  <header class="hero">
    <h1 class="wave-title" id="pageTitle">YOUR TITLE HERE</h1>
    <div class="brand-row">
      <div class="logo-circle" id="logoCircle">
        <img id="schoolLogo" src="logo/logo.png" alt="">
      </div>
      <p class="school-name" id="schoolName">YOUR SCHOOL NAME</p>
    </div>
  </header>

  <main class="sims">
    <section class="sim-card" id="simA">
      <div class="sim-canvas-wrap"><canvas id="canvasA"></canvas></div>
    </section>
    <section class="sim-card" id="simB">
      <div class="sim-canvas-wrap"><canvas id="canvasB"></canvas></div>
    </section>
  </main>

</div>

<div class="pressure-bar">
  <div class="pressure-dot" id="pressureDot"></div>
  <input type="range" id="pressureSlider" min="0" max="100" value="35" step="1" aria-label="foot traffic rate">
</div>

<script>
/* =========================================================
   0. GLOBAL STATE — a walking figure triggers the whole chain.
   The slider only controls how often people cross (foot traffic).
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

const traffic = { value: 0.35, target: 0.35 };
const energyBus = { activity: 0, charge: 0 };
function triggerStep(amount){
  energyBus.activity = Math.min(1, energyBus.activity + amount);
  energyBus.charge = Math.min(1, energyBus.charge + amount*0.09);
}

const slider = document.getElementById('pressureSlider');
const dot = document.getElementById('pressureDot');
function syncSliderFill(){
  slider.style.setProperty('--fill', slider.value + '%');
}
slider.value = Math.round(traffic.target*100);
syncSliderFill();
slider.addEventListener('input', () => {
  traffic.target = slider.value / 100;
  syncSliderFill();
});

/* decays activity/charge on its own clock, independent of either canvas */
let busLast = performance.now();
(function busTick(now){
  const dt = Math.min(0.05,(now-busLast)/1000); busLast = now;
  energyBus.activity = Math.max(0, energyBus.activity - dt*1.1*speedMul);
  energyBus.charge = Math.max(0, energyBus.charge - dt*0.007*speedMul);
  traffic.value += (traffic.target - traffic.value)*0.05;
  dot.style.transform = `scale(${1 + energyBus.activity*0.6})`;
  requestAnimationFrame(busTick);
})(busLast);

/* logo fallback */
const logoImg = document.getElementById('schoolLogo');
const logoCircle = document.getElementById('logoCircle');
logoImg.addEventListener('error', () => logoCircle.classList.add('empty'));

/* title letters -> wavy spans */
(function waveText(){
  const el = document.getElementById('pageTitle');
  const text = el.textContent;
  el.textContent = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.style.setProperty('--i', i);
    el.appendChild(span);
  });
})();

/* =========================================================
   1. BACKGROUND: monochrome electric network + DNA helix
   ========================================================= */
(function bg(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  let nodes = [];
  let sparks = [];
  let helixPhase = 0;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.max(38, Math.min(100, Math.floor((w*h)/16000)));
    nodes = Array.from({length:count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function drawHelix(dt){
    const rows = Math.max(1, Math.round(h/520));
    for(let r=0;r<rows;r++){
      const baseY = (h/rows)*(r+0.5);
      const amp = 46, freq = 0.012, gap = 34;
      ctx.lineWidth = 1;
      for(let x=0; x<w; x+=gap){
        const y1 = baseY + Math.sin(x*freq + helixPhase + r)*amp;
        const y2 = baseY + Math.sin(x*freq + helixPhase + r + Math.PI)*amp;
        const a = 0.12 + 0.06*Math.sin(x*0.02 + helixPhase*2);
        ctx.strokeStyle = `rgba(230,235,245,${Math.max(0,a*0.5)})`;
        ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x,y2); ctx.stroke();
        ctx.fillStyle = `rgba(240,244,255,${Math.max(0,a)})`;
        ctx.beginPath(); ctx.arc(x,y1,1.6,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x,y2,1.6,0,Math.PI*2); ctx.fill();
      }
    }
    helixPhase += dt * 0.35 * speedMul;
  }

  function step(node){
    node.x += node.vx * speedMul; node.y += node.vy * speedMul;
    if(node.x < -20) node.x = w+20; if(node.x > w+20) node.x = -20;
    if(node.y < -20) node.y = h+20; if(node.y > h+20) node.y = -20;
  }

  function maybeSpark(){
    if(Math.random() < 0.012 * speedMul && nodes.length > 2){
      const a = nodes[Math.floor(Math.random()*nodes.length)];
      const b = nodes[Math.floor(Math.random()*nodes.length)];
      sparks.push({a,b,t:0});
    }
  }

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);

    drawHelix(dt);

    const maxDist = Math.min(180, Math.max(110, w/9));
    for(let i=0;i<nodes.length;i++){
      step(nodes[i]);
      for(let j=i+1;j<nodes.length;j++){
        const dx = nodes[i].x-nodes[j].x, dy = nodes[i].y-nodes[j].y;
        const d = Math.hypot(dx,dy);
        if(d < maxDist){
          const a = (1 - d/maxDist) * 0.35;
          ctx.strokeStyle = `rgba(210,216,230,${a})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
        }
      }
      ctx.fillStyle = 'rgba(235,238,245,0.55)';
      ctx.beginPath(); ctx.arc(nodes[i].x,nodes[i].y,1.7,0,Math.PI*2); ctx.fill();
    }

    maybeSpark();
    sparks.forEach(s => { s.t += dt * 0.9 * speedMul; });
    sparks = sparks.filter(s => s.t < 1);
    sparks.forEach(s => {
      const x = s.a.x + (s.b.x-s.a.x)*s.t;
      const y = s.a.y + (s.b.y-s.a.y)*s.t;
      const grad = ctx.createRadialGradient(x,y,0,x,y,10);
      grad.addColorStop(0,'rgba(150,190,255,0.95)');
      grad.addColorStop(1,'rgba(150,190,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(230,240,255,0.9)';
      ctx.beginPath(); ctx.arc(x,y,2,0,Math.PI*2); ctx.fill();
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* =========================================================
   2. SHARED THREE.JS HELPERS
   ========================================================= */
function makeRenderer(canvas){
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.shadowMap.enabled = false;
  return renderer;
}

function fitRenderer(renderer, camera, wrap){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

function makeFlowParticles(curve, count, color, size){
  const group = new THREE.Group();
  const items = [];
  const geo = new THREE.SphereGeometry(size, 10, 10);
  for(let i=0;i<count;i++){
    const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.9 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    group.add(mesh);
    items.push({ mesh, t: i/count });
  }
  function update(dt, speed){
    items.forEach(it => {
      if(speed <= 0.001){ it.mesh.visible = false; return; }
      it.mesh.visible = true;
      it.t = (it.t + dt*speed) % 1;
      const p = curve.getPointAt(it.t);
      it.mesh.position.copy(p);
    });
  }
  return { group, update };
}

/* low-poly walking figure — cylinders + spheres only (three r128 has no CapsuleGeometry) */
function makeWalker(){
  const skin = new THREE.MeshStandardMaterial({ color:0xe7ecf6, roughness:0.55, metalness:0.12, emissive:0x1638a0, emissiveIntensity:0.05 });
  const g = new THREE.Group();

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11,14,14), skin);
  head.position.y = 0.86; g.add(head);

  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,0.42,10), skin);
  torso.position.y = 0.56; g.add(torso);

  function limb(len, rad, y, x){
    const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad*0.85, len, 8), skin);
    mesh.position.y = -len/2;
    pivot.add(mesh);
    g.add(pivot);
    return pivot;
  }
  const legL = limb(0.42, 0.05, 0.34, -0.07);
  const legR = limb(0.42, 0.05, 0.34,  0.07);
  const armL = limb(0.34, 0.035, 0.72, -0.19);
  const armR = limb(0.34, 0.035, 0.72,  0.19);

  return { group:g, legL, legR, armL, armR };
}

/* =========================================================
   3. SIM A — a person walks the tiles, triggering the charge
   ========================================================= */
(function simA(){
 try{
  const wrap = document.querySelector('#simA .sim-canvas-wrap');
  const canvas = document.getElementById('canvasA');
  const renderer = makeRenderer(canvas);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(5.2, 3.4, 7.2);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.4;
  controls.minDistance = 4.5; controls.maxDistance = 14;
  controls.target.set(0, 0.25, 0);

  scene.add(new THREE.AmbientLight(0x8fa4ff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5,8,4);
  scene.add(dir);
  const rim = new THREE.PointLight(0x4f8dff, 1.2, 14);
  rim.position.set(-3,3,-2);
  scene.add(rim);

  // floor
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(10, 0.2, 5.5),
    new THREE.MeshStandardMaterial({ color:0x0a0d12, roughness:0.85, metalness:0.2 })
  );
  floor.position.y = -0.5;
  scene.add(floor);

  // walkway of pressable tiles
  const tileGeo = new THREE.BoxGeometry(1.15, 0.28, 1.7);
  const tiles = [];
  for(let i=-2;i<=2;i++){
    const mat = new THREE.MeshStandardMaterial({ color:0xcfd6e6, roughness:0.4, metalness:0.35, emissive:0x1638a0, emissiveIntensity:0 });
    const t = new THREE.Mesh(tileGeo, mat);
    t.position.set(i*1.3, -0.24, 0);
    t.userData = { baseX:i*1.3, pressed:false, mat };
    scene.add(t);
    tiles.push(t);
  }

  // coil / generator, fed by every tile
  const coilGroup = new THREE.Group();
  coilGroup.position.set(0, -0.85, 0);
  scene.add(coilGroup);
  const coilCore = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28,0.28,0.5,20),
    new THREE.MeshStandardMaterial({ color:0x1a2130, metalness:0.6, roughness:0.4 })
  );
  coilGroup.add(coilCore);
  const coilWireMat = new THREE.MeshStandardMaterial({ color:0xb9c4d8, metalness:0.7, roughness:0.3 });
  const coilCurvePts = [];
  for(let i=0;i<=60;i++){
    const a = i/60 * Math.PI * 8;
    coilCurvePts.push(new THREE.Vector3(Math.cos(a)*0.34, -0.28 + (i/60)*0.56, Math.sin(a)*0.34));
  }
  const coilCurve = new THREE.CatmullRomCurve3(coilCurvePts);
  const coilMesh = new THREE.Mesh(new THREE.TubeGeometry(coilCurve, 160, 0.02, 6, false), coilWireMat);
  coilGroup.add(coilMesh);

  // wire from coil to battery
  const battPos = new THREE.Vector3(3.7, -0.15, 0.7);
  const wireCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,-0.65,0),
    new THREE.Vector3(1.5,-0.7,0.3),
    new THREE.Vector3(2.7,-0.4,0.5),
    battPos.clone().add(new THREE.Vector3(-0.4,-0.1,0)),
  ]);
  const wireMesh = new THREE.Mesh(
    new THREE.TubeGeometry(wireCurve, 80, 0.028, 6, false),
    new THREE.MeshStandardMaterial({ color:0x30384a, metalness:0.6, roughness:0.4 })
  );
  scene.add(wireMesh);
  const flow = makeFlowParticles(wireCurve, 10, 0x8ec3ff, 0.045);
  scene.add(flow.group);

  // battery
  const battGroup = new THREE.Group();
  battGroup.position.copy(battPos);
  scene.add(battGroup);
  const battShell = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42,0.42,1.1,24,1,true),
    new THREE.MeshStandardMaterial({ color:0x151b26, metalness:0.5, roughness:0.5, side:THREE.DoubleSide })
  );
  battGroup.add(battShell);
  const battCap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16,0.16,0.14,16),
    new THREE.MeshStandardMaterial({ color:0x3a4358, metalness:0.7, roughness:0.3 })
  );
  battCap.position.y = 0.62;
  battGroup.add(battCap);
  const battFill = new THREE.Mesh(
    new THREE.CylinderGeometry(0.36,0.36,1,20),
    new THREE.MeshStandardMaterial({ color:0x1638a0, emissive:0x1638a0, emissiveIntensity:0.3, roughness:0.3, metalness:0.1 })
  );
  battFill.position.y = -0.5;
  battFill.scale.y = 0.02;
  battGroup.add(battFill);
  const battGlow = new THREE.PointLight(0x4f8dff, 0, 3);
  battGlow.position.set(0,0.2,0);
  battGroup.add(battGlow);

  // the person
  const walker = makeWalker();
  scene.add(walker.group);
  let walkX = -3.6, walkDir = 1, walkPhase = 0;

  function resize(){ fitRenderer(renderer, camera, wrap); }
  window.addEventListener('resize', resize); resize();

  let last = performance.now();
  function animate(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now;

    const speed = (0.5 + traffic.value*1.9) * speedMul;
    walkX += walkDir*speed*dt;
    if(walkX > 3.7){ walkX = 3.7; walkDir = -1; }
    if(walkX < -3.7){ walkX = -3.7; walkDir = 1; }

    walker.group.position.set(walkX, -0.1, 0.6);
    walker.group.rotation.y = walkDir > 0 ? Math.PI/2 : -Math.PI/2;

    walkPhase += dt*speed*7;
    walker.legL.rotation.x =  Math.sin(walkPhase)*0.6;
    walker.legR.rotation.x = -Math.sin(walkPhase)*0.6;
    walker.armL.rotation.x = -Math.sin(walkPhase)*0.5;
    walker.armR.rotation.x =  Math.sin(walkPhase)*0.5;
    walker.group.position.y = -0.1 + Math.abs(Math.sin(walkPhase))*0.02;

    // each tile presses when the walker's foot is over it
    tiles.forEach(t => {
      const dist = Math.abs(walkX - t.userData.baseX);
      const near = dist < 0.6;
      if(near && !t.userData.pressed){
        t.userData.pressed = true;
        triggerStep(0.5);
      } else if(!near && t.userData.pressed){
        t.userData.pressed = false;
      }
      const targetY = near ? -0.34 : -0.24;
      t.position.y += (targetY - t.position.y) * 0.35;
      t.userData.mat.emissiveIntensity += ((near?0.55:0) - t.userData.mat.emissiveIntensity) * 0.2;
    });

    coilGroup.rotation.y += dt * (0.3 + energyBus.activity*7) * speedMul;

    battFill.scale.y = 0.02 + energyBus.charge*0.98;
    battFill.position.y = -0.5 + battFill.scale.y/2;
    battFill.material.emissiveIntensity = 0.2 + energyBus.charge*0.9;
    battGlow.intensity = energyBus.charge*1.6;

    flow.update(dt, energyBus.activity*1.7 + 0.04);
    rim.intensity = 1.0 + energyBus.activity*0.9;

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
 } catch(err){ console.error('Sim A failed to start:', err); }
})();

/* =========================================================
   4. SIM B — exploded internal layers of the tile
   ========================================================= */
(function simB(){
 try{
  const wrap = document.querySelector('#simB .sim-canvas-wrap');
  const canvas = document.getElementById('canvasB');
  const renderer = makeRenderer(canvas);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  camera.position.set(3.6, 2.6, 4.6);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.5;
  controls.minDistance = 2.6; controls.maxDistance = 9;
  controls.target.set(0, 0.4, 0);

  scene.add(new THREE.AmbientLight(0x8fa4ff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(4,6,3);
  scene.add(dir);
  const rim = new THREE.PointLight(0x4f8dff, 1.2, 10);
  rim.position.set(-2,2,-2);
  scene.add(rim);

  const stack = new THREE.Group();
  scene.add(stack);

  function layer(geo, mat){
    const m = new THREE.Mesh(geo, mat);
    stack.add(m);
    return m;
  }

  const coverTop = layer(
    new THREE.BoxGeometry(1.6,0.14,1.6),
    new THREE.MeshStandardMaterial({ color:0xcfd6e6, metalness:0.4, roughness:0.35 })
  );
  const electrodeTop = layer(
    new THREE.CylinderGeometry(0.62,0.62,0.03,28),
    new THREE.MeshStandardMaterial({ color:0xd8b25a, metalness:0.85, roughness:0.25 })
  );
  const piezo = layer(
    new THREE.CylinderGeometry(0.58,0.58,0.16,28),
    new THREE.MeshStandardMaterial({ color:0x274b9c, emissive:0x1638a0, emissiveIntensity:0.15, metalness:0.2, roughness:0.35, transparent:true, opacity:0.88 })
  );
  const electrodeBottom = layer(
    new THREE.CylinderGeometry(0.62,0.62,0.03,28),
    new THREE.MeshStandardMaterial({ color:0xd8b25a, metalness:0.85, roughness:0.25 })
  );
  const elastic = layer(
    new THREE.BoxGeometry(1.5,0.22,1.5),
    new THREE.MeshStandardMaterial({ color:0x1a2130, metalness:0.3, roughness:0.75 })
  );
  const baseP = layer(
    new THREE.BoxGeometry(1.7,0.16,1.7),
    new THREE.MeshStandardMaterial({ color:0x0d1117, metalness:0.4, roughness:0.7 })
  );

  const restY = { coverTop:1.3, electrodeTop:0.78, piezo:0.55, electrodeBottom:0.34, elastic:0.1, baseP:-0.22 };
  const parts = { coverTop, electrodeTop, piezo, electrodeBottom, elastic, baseP };

  // small rectifier bridge: 4 diode-like cones
  const bridgeGroup = new THREE.Group();
  bridgeGroup.position.set(1.15, -0.05, 0.9);
  scene.add(bridgeGroup);
  const diodeMat = new THREE.MeshStandardMaterial({ color:0x2a3346, metalness:0.6, roughness:0.35 });
  const diodePositions = [[-0.14,-0.14],[0.14,-0.14],[-0.14,0.14],[0.14,0.14]];
  diodePositions.forEach(([x,z]) => {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.16,10), diodeMat);
    cone.position.set(x,0,z);
    cone.rotation.x = Math.PI/2;
    bridgeGroup.add(cone);
  });

  // small battery
  const miniBatt = new THREE.Group();
  miniBatt.position.set(2.0, -0.05, 1.4);
  scene.add(miniBatt);
  const miniShell = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.2,0.5,18),
    new THREE.MeshStandardMaterial({ color:0x151b26, metalness:0.5, roughness:0.5 })
  );
  miniBatt.add(miniShell);
  const miniFill = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16,0.16,0.42,16),
    new THREE.MeshStandardMaterial({ color:0x1638a0, emissive:0x1638a0, emissiveIntensity:0.3, roughness:0.3 })
  );
  miniFill.scale.y = 0.05;
  miniBatt.add(miniFill);

  // wires: piezo -> bridge -> battery
  const curve1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.4,0.55,0.3),
    new THREE.Vector3(0.8,0.3,0.6),
    new THREE.Vector3(1.15,0.02,0.9),
  ]);
  const curve2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.15,-0.05,0.9),
    new THREE.Vector3(1.6,-0.05,1.15),
    new THREE.Vector3(2.0,-0.05,1.4),
  ]);
  const wireMat = new THREE.MeshStandardMaterial({ color:0x30384a, metalness:0.6, roughness:0.4 });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve1, 40, 0.018, 6, false), wireMat));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve2, 40, 0.018, 6, false), wireMat));
  const flow1 = makeFlowParticles(curve1, 4, 0x8ec3ff, 0.03);
  const flow2 = makeFlowParticles(curve2, 4, 0x8ec3ff, 0.03);
  scene.add(flow1.group, flow2.group);

  stack.position.y = -0.3;

  function resize(){ fitRenderer(renderer, camera, wrap); }
  window.addEventListener('resize', resize); resize();

  let last = performance.now();
  function animate(now){
    const dt = Math.min(0.05,(now-last)/1000); last = now;
    const a = energyBus.activity; // spikes on every real footstep from sim A, then decays

    // sits exploded for clarity, pulls together for a beat on every step
    const gap = 1 - a*0.55;
    parts.coverTop.position.y = restY.coverTop * gap;
    parts.electrodeTop.position.y = restY.electrodeTop * gap;
    parts.piezo.position.y = restY.piezo * gap;
    parts.electrodeBottom.position.y = restY.electrodeBottom * gap;
    parts.elastic.position.y = restY.elastic * gap;
    parts.baseP.position.y = restY.baseP;

    piezo.material.emissiveIntensity = 0.15 + a*1.1;
    piezo.scale.y = 1 - a*0.18;

    miniFill.scale.y = 0.05 + energyBus.charge*0.95;
    miniFill.position.y = -0.21 + (miniFill.scale.y*0.42)/2;
    miniFill.material.emissiveIntensity = 0.2 + energyBus.charge*0.9;

    flow1.update(dt, a*1.6 + 0.03);
    flow2.update(dt, a*1.6 + 0.03);
    rim.intensity = 1.0 + a*0.8;

    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
 } catch(err){ console.error('Sim B failed to start:', err); }
})();

if(typeof THREE === 'undefined'){
  console.error('Three.js did not load — check your internet connection, since the 3D scenes are loaded from a CDN.');
}
</script>
